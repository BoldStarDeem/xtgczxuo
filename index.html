<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Крестики-Нолики</h1>
        <div class="status" id="status">Ход: X</div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="scoreboard">
            <div class="score">
                <span class="label x-label">X</span>
                <span class="value" id="score-x">0</span>
            </div>
            <div class="score">
                <span class="label draw-label">Ничья</span>
                <span class="value" id="score-draw">0</span>
            </div>
            <div class="score">
                <span class="label o-label">O</span>
                <span class="value" id="score-o">0</span>
            </div>
        </div>
        <button class="restart-btn" id="restart">Новая игра</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
